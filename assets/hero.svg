<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Pragya Mishra — builder of useful systems</title>
  <desc id="description">An animated editorial header in deep midnight, violet, gold, and electric blue.</desc>
  <defs>
    <linearGradient id="bg" x1="50" y1="20" x2="1160" y2="400" gradientUnits="userSpaceOnUse"><stop stop-color="#111526"/><stop offset="0.48" stop-color="#171923"/><stop offset="1" stop-color="#0D1A25"/></linearGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientTransform="translate(250 48) rotate(41) scale(530 410)" gradientUnits="userSpaceOnUse"><stop stop-color="#8B5CF6" stop-opacity=".34"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue" cx="0" cy="0" r="1" gradientTransform="translate(1040 356) rotate(-143) scale(500 300)" gradientUnits="userSpaceOnUse"><stop stop-color="#35C3FF" stop-opacity=".26"/><stop offset="1" stop-color="#35C3FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="160" y1="0" x2="1050" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#8B5CF6" stop-opacity="0"/><stop offset=".3" stop-color="#8B5CF6"/><stop offset=".68" stop-color="#F4C95D"/><stop offset="1" stop-color="#35C3FF" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#B9C0D0" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="22" fill="url(#bg)"/><rect width="1200" height="420" rx="22" fill="url(#violet)"/><rect width="1200" height="420" rx="22" fill="url(#blue)"/><rect width="1200" height="420" rx="22" fill="url(#grid)"/>
  <g opacity=".4"><path d="M-46 335C180 210 228 435 484 283S746 82 939 209s222 72 313-22" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="5 10"/><path d="M-20 352C186 237 239 447 496 298s264-183 449-70 214 65 279 10" stroke="#35C3FF" stroke-opacity=".6" stroke-width="1"/><circle cx="496" cy="298" r="5" fill="#F4C95D" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="939" cy="209" r="4" fill="#35C3FF" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(74 64)"><rect width="142" height="30" rx="15" fill="#F4C95D" fill-opacity=".12" stroke="#F4C95D" stroke-opacity=".5"/><circle cx="18" cy="15" r="4" fill="#F4C95D"><animate attributeName="opacity" values=".35;1;.35" dur="1.5s" repeatCount="indefinite"/></circle><text x="31" y="20" fill="#F4C95D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.5">SYSTEM ONLINE</text></g>
  <text x="72" y="177" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="67" font-weight="700" letter-spacing="-2">PRAGYA MISHRA</text>
  <text x="76" y="225" fill="#B9C0D0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">I build systems that make people faster.</text>
  <rect x="75" y="258" width="610" height="2" fill="url(#line)"><animate attributeName="width" values="150;610;150" dur="5s" repeatCount="indefinite"/></rect>
  <g transform="translate(76 298)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.1"><text fill="#8B5CF6">AUTOMATE</text><text x="114" fill="#4C566A">/</text><text x="135" fill="#35C3FF">BUILD</text><text x="210" fill="#4C566A">/</text><text x="231" fill="#F4C95D">ITERATE</text></g>
  <g transform="translate(990 58)"><rect width="136" height="136" rx="18" fill="#0B1020" fill-opacity=".65" stroke="#B9C0D0" stroke-opacity=".16"/><path d="M38 86V51l30-17 30 17v35L68 103 38 86Z" stroke="#8B5CF6" stroke-width="2"/><path d="M68 34v35m30-18L68 69 38 51m30 18-30 17m30-17 30 17" stroke="#35C3FF" stroke-width="1.5"/><circle cx="68" cy="69" r="6" fill="#F4C95D" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle><text x="68" y="123" text-anchor="middle" fill="#B9C0D0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.4">MAKE IT REAL</text></g>
  <text x="76" y="376" fill="#6E7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">// PYTHON · PRODUCT · POSSIBILITY</text>
</svg>
