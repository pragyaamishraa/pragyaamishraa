<svg width="1200" height="180" viewBox="0 0 1200 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Pragya's featured project radar</title>
  <desc id="description">Five colorful project signals connected by a line: Dearly You, StadiumGuard AI, DecideFast, DeskShare and PlaySic.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="180" gradientUnits="userSpaceOnUse"><stop stop-color="#171923"/><stop offset="1" stop-color="#101C2A"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="180" rx="18" fill="url(#bg)"/><path d="M105 90H1095" stroke="#596174" stroke-opacity=".45" stroke-width="2" stroke-dasharray="4 10"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(110 90)"><circle r="26" fill="#FF8EAF" fill-opacity=".16"/><circle r="9" fill="#FF8EAF" filter="url(#glow)"><animate attributeName="r" values="8;12;8" dur="2.3s" repeatCount="indefinite"/></circle><text y="55" text-anchor="middle" fill="#F0F6FC" font-size="14" font-weight="700">Dearly, You</text><text y="73" text-anchor="middle" fill="#8B949E" font-size="11">MINDFUL AI</text></g>
    <g transform="translate(360 90)"><circle r="26" fill="#8B5CF6" fill-opacity=".16"/><circle r="9" fill="#8B5CF6" filter="url(#glow)"><animate attributeName="r" values="8;12;8" dur="2.1s" repeatCount="indefinite"/></circle><text y="55" text-anchor="middle" fill="#F0F6FC" font-size="14" font-weight="700">StadiumGuard</text><text y="73" text-anchor="middle" fill="#8B949E" font-size="11">AI OPERATIONS</text></g>
    <g transform="translate(600 90)"><circle r="26" fill="#F4C95D" fill-opacity=".16"/><circle r="9" fill="#F4C95D" filter="url(#glow)"><animate attributeName="r" values="8;12;8" dur="2.5s" repeatCount="indefinite"/></circle><text y="55" text-anchor="middle" fill="#F0F6FC" font-size="14" font-weight="700">DecideFast</text><text y="73" text-anchor="middle" fill="#8B949E" font-size="11">DATA CLARITY</text></g>
    <g transform="translate(840 90)"><circle r="26" fill="#35C3FF" fill-opacity=".16"/><circle r="9" fill="#35C3FF" filter="url(#glow)"><animate attributeName="r" values="8;12;8" dur="1.8s" repeatCount="indefinite"/></circle><text y="55" text-anchor="middle" fill="#F0F6FC" font-size="14" font-weight="700">DeskShare</text><text y="73" text-anchor="middle" fill="#8B949E" font-size="11">TEAM FLOW</text></g>
    <g transform="translate(1090 90)"><circle r="26" fill="#FF6B9D" fill-opacity=".16"/><circle r="9" fill="#FF6B9D" filter="url(#glow)"><animate attributeName="r" values="8;12;8" dur="2.8s" repeatCount="indefinite"/></circle><text y="55" text-anchor="middle" fill="#F0F6FC" font-size="14" font-weight="700">PlaySic</text><text y="73" text-anchor="middle" fill="#8B949E" font-size="11">MUSIC + YOU</text></g>
  </g>
</svg>
